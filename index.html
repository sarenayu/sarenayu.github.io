<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      container: { center: true, padding: '1.5rem' },
      extend: {
        colors: {
          border: 'hsl(var(--border))',
          input: 'hsl(var(--input))',
          ring: 'hsl(var(--ring))',
          background: 'hsl(var(--background))',
          foreground: 'hsl(var(--foreground))',
          primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
          secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
          destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
          muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
          accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
          popover: { DEFAULT: 'hsl(var(--popover))', foreground: 'hsl(var(--popover-foreground))' },
          card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' },
          ember: { DEFAULT: 'hsl(var(--ember))' }
        },
        borderRadius: {
          lg: 'var(--radius)',
          md: 'calc(var(--radius) - 2px)',
          sm: 'calc(var(--radius) - 4px)'
        },
        fontFamily: {
          display: ['"Bodoni Moda"', 'Georgia', 'Times New Roman', 'serif'],
          sans: ['"IBM Plex Sans"', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'Helvetica', 'Arial', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
        }
      }
    }
  }

<style>
  /* ── Letters Above · a night sky commits to one theme by design ────────── */
  :root {
    --background: 224 46% 5%;
    --foreground: 210 34% 92%;
    --card: 222 38% 8%;
    --card-foreground: 210 34% 92%;
    --popover: 223 42% 7%;
    --popover-foreground: 210 34% 92%;
    --primary: 205 82% 76%;
    --primary-foreground: 223 46% 7%;
    --secondary: 220 24% 15%;
    --secondary-foreground: 210 30% 90%;
    --muted: 220 22% 13%;
    --muted-foreground: 214 15% 64%;
    --accent: 220 26% 18%;
    --accent-foreground: 210 32% 92%;
    --destructive: 8 70% 59%;
    --destructive-foreground: 223 46% 7%;
    --ember: 8 70% 61%;
    --border: 216 22% 19%;
    --input: 216 22% 20%;
    --ring: 205 82% 76%;
    --radius: 0.6rem;
    color-scheme: dark;
  }

  * { border-color: hsl(var(--border)); }

  html, body { height: 100%; }
  body {
    margin: 0;
    background-color: hsl(var(--background));
    color: hsl(var(--foreground));
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #root { height: 100%; }

  h1, h2, h3 { text-wrap: balance; }

  .font-display { font-family: "Bodoni Moda", Georgia, serif; }
  .num { font-variant-numeric: tabular-nums; }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: hsl(var(--muted-foreground));

  /* floating instrument chrome, as on the reference charts */
  .glass {
    background: linear-gradient(180deg, hsl(223 40% 9% / 0.92), hsl(223 44% 7% / 0.92));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid hsl(216 24% 22% / 0.85);

  .hairline { background: linear-gradient(90deg, transparent, hsl(216 24% 30% / 0.9), transparent); height: 1px; }

  /* scrollbars */
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: hsl(216 20% 26%); border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: hsl(216 20% 34%); background-clip: content-box; }

  :focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 2px; }

  input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; }
  input[type="range"]::-webkit-slider-runnable-track { height: 3px; background: hsl(var(--secondary)); border-radius: 99px; }
  input[type="range"]::-moz-range-track { height: 3px; background: hsl(var(--secondary)); border-radius: 99px; }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; margin-top: -6px;

  }
  input[type="range"]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 99px; border: 2px solid hsl(var(--background));

  }

  input[type="date"]::-webkit-calendar-picker-indicator,
  input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }

  @keyframes sw-fade-in { from { opacity: 0 } to { opacity: 1 } }
  @keyframes sw-rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  @keyframes sw-scale-in { from { opacity: 0; transform: translate(-50%, -48%) scale(.97) } to { opacity: 1; transform: translate(-50%, -50%) scale(1) } }
  @keyframes sw-slide-right { from { transform: translateX(100%) } to { transform: none } }
  @keyframes sw-twinkle { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
  @keyframes sw-drift { from { transform: translateY(0) } to { transform: translateY(-8px) } }

  .a-fade { animation: sw-fade-in .22s ease both; }
  .a-rise { animation: sw-rise .5s cubic-bezier(.2,.7,.3,1) both; }
  .a-pop { animation: sw-scale-in .18s cubic-bezier(.2,.8,.3,1) both; }
  .a-sheet { animation: sw-slide-right .28s cubic-bezier(.2,.8,.3,1) both; }

  @media (prefers-reduced-motion: reduce) {

  }

  /* ── the eyepiece: the site opens inside a telescope ─────────────────── */
  :root { --scope-r: 20vmin; }
  @media (max-width: 700px) { :root { --scope-r: 32vmin; } }
  .scope-clip { clip-path: circle(var(--scope-r) at 50% 50%); }
  .scope-opening { animation: scope-open 1600ms cubic-bezier(.62,.02,.24,1) forwards; }
  @keyframes scope-open {
    from { clip-path: circle(var(--scope-r) at 50% 50%); }
    to   { clip-path: circle(180vmin at 50% 50%); }
  }
  .scope-glass { width: calc(var(--scope-r) * 2); height: calc(var(--scope-r) * 2); }

  .scope-vignette {
    background: radial-gradient(circle at 50% 50%,
      rgba(0,0,0,0) 44%, rgba(2,4,9,.55) 74%, rgba(2,4,9,.95) 96%, #02040a 100%);
  }
  .scope-ring {
    box-shadow:
      inset 0 0 0 1px rgba(150,178,220,.18),
      inset 0 0 26px 4px rgba(6,10,20,.75),
      0 0 0 1px rgba(126,152,196,.12),
      0 0 54px 8px rgba(18,30,58,.40);
  }
  .scope-knurl {
    background: repeating-conic-gradient(from 0deg,
      rgba(150,176,216,.20) 0deg .34deg, rgba(150,176,216,0) .34deg 3deg);
    -webkit-mask: radial-gradient(circle, transparent 0 calc(50% - 11px), #000 calc(50% - 11px) calc(50% - 1px), transparent calc(50% - 1px));
    mask: radial-gradient(circle, transparent 0 calc(50% - 11px), #000 calc(50% - 11px) calc(50% - 1px), transparent calc(50% - 1px));
  }
  .scope-flare {
    background: conic-gradient(from 210deg,
      rgba(255,196,150,.16), rgba(150,196,255,.20), rgba(120,150,220,0) 40%,
      rgba(150,196,255,.14) 72%, rgba(255,196,150,.16));
    -webkit-mask: radial-gradient(circle, transparent 0 calc(50% - 3px), #000 calc(50% - 3px) 50%, transparent 50%);
    mask: radial-gradient(circle, transparent 0 calc(50% - 3px), #000 calc(50% - 3px) 50%, transparent 50%);
  }

  /* ── the glass itself: light bends at the rim and comes apart into colour ──
     A real objective smears and blurs what passes near its edge, and splits it
     because blue turns harder than red. Three thin annuli do the whole job:
     one that blurs and lifts, and two tinted rings pulled a hair apart. */
  .scope-refract {
    -webkit-backdrop-filter: blur(4px) saturate(1.4) brightness(1.12);
    backdrop-filter: blur(4px) saturate(1.4) brightness(1.12);
    -webkit-mask: radial-gradient(circle,
      transparent 0 calc(50% - 9%), rgba(0,0,0,.35) calc(50% - 6.5%),
      rgba(0,0,0,.8) calc(50% - 3%), #000 calc(50% - 1.2%), #000 calc(50% - 0.3%), transparent 50%);
    mask: radial-gradient(circle,
      transparent 0 calc(50% - 9%), rgba(0,0,0,.35) calc(50% - 6.5%),
      rgba(0,0,0,.8) calc(50% - 3%), #000 calc(50% - 1.2%), #000 calc(50% - 0.3%), transparent 50%);
  }
  /* the rim itself: a bright meniscus where the curve turns away */
  .scope-meniscus {
    background: radial-gradient(circle,
      rgba(255,255,255,0) calc(50% - 4.6%),
      rgba(202,226,255,.10) calc(50% - 2.6%),
      rgba(228,242,255,.26) calc(50% - 1.0%),
      rgba(255,255,255,.34) calc(50% - 0.35%),
      rgba(160,196,244,0) 50%);
  }
  /* Dispersion: blue turns harder than red, so the cool fringe lands inside the
     warm one and they never quite meet. Two bands, cleanly separated. */
  .scope-fringe {
    mix-blend-mode: screen;
    background:
      radial-gradient(circle at 50% 50%,
        rgba(0,0,0,0) calc(50% - 5.4%),
        rgba(70,150,255,.13) calc(50% - 4.0%),
        rgba(104,186,255,.36) calc(50% - 2.9%),
        rgba(80,160,255,.16) calc(50% - 2.0%),
        rgba(0,0,0,0) calc(50% - 1.5%));
    animation: scope-swim 9s ease-in-out infinite;
  }
  .scope-fringe-warm {
    mix-blend-mode: screen;
    background:
      radial-gradient(circle at 50% 50%,
        rgba(0,0,0,0) calc(50% - 1.7%),
        rgba(255,138,74,.18) calc(50% - 1.15%),
        rgba(255,186,112,.31) calc(50% - 0.6%),
        rgba(255,214,150,.21) calc(50% - 0.15%),
        rgba(0,0,0,0) 50%);
    animation: scope-swim 9s ease-in-out infinite reverse;
  }
  /* the split widens and narrows a little, the way a held instrument breathes */
  @keyframes scope-swim {
    0%, 100% { transform: scale(1);      opacity: .78 }
    50%      { transform: scale(1.006);  opacity: 1 }
  }
  /* a faint spectral wash across the whole field, strongest off-axis */
  .scope-spectrum {
    mix-blend-mode: screen;
    opacity: .5;
    background:
      radial-gradient(circle at 38% 34%, rgba(120,170,255,.10), rgba(0,0,0,0) 46%),
      radial-gradient(circle at 64% 68%, rgba(255,168,120,.09), rgba(0,0,0,0) 46%);
  }
  @media (prefers-reduced-motion: reduce) {
    .scope-fringe, .scope-fringe-warm { animation: none }
  }
  /* the way in is a line of type, not a pill of colour sitting on the scene */
  .scope-cta {
    position: relative;
    padding: 8px 4px 10px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.30em;
    text-transform: uppercase;
    color: hsl(205 60% 88% / .82);
    background: none;
    border: 0;
    cursor: pointer;
    transition: color .3s ease, letter-spacing .5s cubic-bezier(.2,.8,.3,1);
  }
  .scope-cta::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 0;
    height: 1px;
    width: 34px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, hsl(205 82% 78% / .9), transparent);

    animation: scope-breathe 3.8s ease-in-out infinite;
  }
  .scope-cta:hover, .scope-cta:focus-visible { color: #fff; letter-spacing: 0.36em; }

  .scope-cta:focus-visible { outline: none; }

  .scope-fade { animation: scope-fade 700ms ease forwards; }
  @keyframes scope-fade { to { opacity: 0; transform: scale(1.9); } }
  @keyframes scope-breathe { 0%,100% { opacity: .55 } 50% { opacity: .95 } }

  .seal {
    width: 30px; height: 30px; border-radius: 999px;

    display: grid; place-items: center; color: rgba(255, 226, 210, .92);

  /* ── reading pages: plates, rules and margins ─────────────────────────── */
  .page-sky {

  }
  .rule-t { border-top: 1px solid hsl(216 22% 19%); }

  /* a saved figure is shown the way a plate is shown in an atlas */
  .plate { position: relative; }
  .plate::after {

    position: absolute;
    inset: 10px;
    pointer-events: none;
    border: 1px solid hsl(205 40% 70% / .10);
    background:
      linear-gradient(hsl(205 60% 74% / .45) 0 0) 0 0 / 9px 1px no-repeat,
      linear-gradient(hsl(205 60% 74% / .45) 0 0) 0 0 / 1px 9px no-repeat,
      linear-gradient(hsl(205 60% 74% / .45) 0 0) 100% 0 / 9px 1px no-repeat,
      linear-gradient(hsl(205 60% 74% / .45) 0 0) 100% 0 / 1px 9px no-repeat,
      linear-gradient(hsl(205 60% 74% / .45) 0 0) 0 100% / 9px 1px no-repeat,
      linear-gradient(hsl(205 60% 74% / .45) 0 0) 0 100% / 1px 9px no-repeat,
      linear-gradient(hsl(205 60% 74% / .45) 0 0) 100% 100% / 9px 1px no-repeat,
      linear-gradient(hsl(205 60% 74% / .45) 0 0) 100% 100% / 1px 9px no-repeat;
  }
  .plate-vignette {
    background: radial-gradient(120% 90% at 50% 42%, transparent 40%, hsl(224 46% 5% / .75) 100%);

  /* a fragment of one of your letters, quoted back on a card */
  .slip {
    border-left: 2px solid hsl(8 70% 61% / .55);
    background: linear-gradient(90deg, hsl(38 40% 82% / .07), transparent 70%);

  .kbd {
    display: inline-block;
    min-width: 1.9rem;
    text-align: center;
    border: 1px solid hsl(216 22% 24%);

    font-family: "IBM Plex Mono", monospace;

  .sky-cursor-grab { cursor: grab; }

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   SKY ENGINE — spherical astronomy, catalogues and low-precision ephemerides
   Positions are J2000 mean places; planets use Keplerian elements, so expect
   arc-minute accuracy rather than observatory accuracy.
   ═══════════════════════════════════════════════════════════════════════════ */
(function (global) {
  'use strict';

  const D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const sin = a => Math.sin(a * D2R), cos = a => Math.cos(a * D2R), tan = a => Math.tan(a * D2R);
  const asin = x => Math.asin(Math.max(-1, Math.min(1, x))) * R2D;
  const atan2 = (y, x) => Math.atan2(y, x) * R2D;
  const rev = x => { const r = x % 360; return r < 0 ? r + 360 : r; };
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  /* ── Time ──────────────────────────────────────────────────────────────── */
  function toJD(date) { return date.getTime() / 86400000 + 2440587.5; }
  function fromJD(jd) { return new Date((jd - 2440587.5) * 86400000); }

  function gmst(jd) {                       // Greenwich mean sidereal time, degrees
    const T = (jd - 2451545.0) / 36525;
    let g = 280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * T * T;
    return rev(g);
  }
  function lst(jd, lon) { return rev(gmst(jd) + lon); }

  /* ── Frames ────────────────────────────────────────────────────────────── */
  // Equatorial (RA/Dec deg) → horizontal (alt/az deg, az from N through E)
  function eqToAltAz(ra, dec, sidereal, lat) {
    lat = clamp(lat, -89.9, 89.9);
    const H = rev(sidereal - ra);
    const sa = sin(dec) * sin(lat) + cos(dec) * cos(lat) * cos(H);
    const alt = asin(sa);
    const az = atan2(-cos(dec) * sin(H), (sin(dec) - sa * sin(lat)) / cos(lat));
    return { alt, az: rev(az) };
  }
  // horizontal → unit vector [East, North, Up]
  function altAzToVec(alt, az) {
    const ca = cos(alt);
    return [ca * sin(az), ca * cos(az), sin(alt)];
  }
  function eqToVec(ra, dec, sidereal, lat) {
    const h = eqToAltAz(ra, dec, sidereal, lat);
    const v = altAzToVec(h.alt, h.az);
    v.alt = h.alt; v.az = h.az;
    return v;
  }
  // galactic (l,b) → equatorial (ra,dec)
  const NGP_RA = 192.85948, NGP_DEC = 27.12825, L_NCP = 122.93192;
  function galToEq(l, b) {
    const d = L_NCP - l;
    const dec = asin(sin(b) * sin(NGP_DEC) + cos(b) * cos(NGP_DEC) * cos(d));
    const ra = rev(NGP_RA + atan2(cos(b) * sin(d), sin(b) * cos(NGP_DEC) - cos(b) * sin(NGP_DEC) * cos(d)));
    return [ra, dec];
  }

  /* ── Colour from B−V index ─────────────────────────────────────────────── */
  function bvColor(bv) {
    const t = clamp(bv, -0.4, 2.0);
    // hand-tuned ramp: hot blue-white → sun-white → amber → ember red
    const stops = [
      [-0.40, 168, 196, 255], [0.00, 202, 220, 255], [0.30, 232, 240, 255],
      [0.58, 255, 246, 232], [0.81, 255, 226, 190], [1.40, 255, 196, 152], [2.00, 255, 168, 132]
    ];
    for (let i = 0; i < stops.length - 1; i++) {
      const a = stops[i], b = stops[i + 1];

  function kepler(M, e) {
    M = rev(M);
    let E = M + R2D * e * sin(M) * (1 + e * cos(M));
    for (let k = 0; k < 6; k++) {
      const dE = (E - R2D * e * sin(E) - M) / (1 - e * cos(E));
      E -= dE;
      if (Math.abs(dE) < 1e-8) break;
    }
    return E;
  }

  vs.forEach(v => {
    spread = Math.max(spread, Math.acos(Sky.clamp(dot(v, C), -1, 1)) * Sky.R2D);
  });
  return {
    az: Sky.rev(Sky.atan2(C[0], C[1])),
    alt: Sky.clamp(Sky.asin(C[2]), -85, 85),
    fov: Sky.clamp(spread * 3.4, 9, 150)
  };
}

/* ── the frame ·────────────────────────────────────────────────────────────*/
function drawSky(ctx, o) {
  const {
    w,
    h,
    view,
    jd,
    site,
    layers
  } = o;
  const P = makeProjector(view, w, h);
  const sid = Sky.lst(jd, site.lon);
  const hits = o.hits || [];
  hits.length = 0;
  const label = makeLabeller(ctx);
  const detail = o.detail === undefined ? 1 : o.detail;
  P.setSky(sid, site.lat);
  const project = (ra, dec) => P.eq(Sky.eqVec(ra, dec));

  /* where the Sun is decides everything about the air */
  const sunBody = (o.bodies || []).find(b => b.id === 'sun');
  const sunHz = sunBody ? Sky.eqToAltAz(sunBody.ra, sunBody.dec, sid, site.lat) : {
    alt: -40,
    az: 0
  };
  const air = layers.atmosphere ? airMass(sunHz.alt) : {
    day: 0,
    twilight: 0,
    stars: 1
  };
  const vis = air.stars;
  ctx.fillStyle = layers.atmosphere ? '#0b1120' : '#04060c';
  ctx.fillRect(0, 0, w, h);
  if (layers.atmosphere) {
    // A quad mesh in (azimuth, altitude), painted at a quarter of the
    // resolution: the air is a smooth thing and the upscale does the blending.
    const K = 5;
    const bw = Math.max(1, Math.ceil(w / K)),
      bh = Math.max(1, Math.ceil(h / K));
    if (!SKY_BUF) {
      SKY_BUF = document.createElement('canvas');
      SKY_CTX = SKY_BUF.getContext('2d');
    }
    if (SKY_BUF.width !== bw || SKY_BUF.height !== bh) {
      SKY_BUF.width = bw;
      SKY_BUF.height = bh;
    }
    const sc = SKY_CTX;
    sc.setTransform(1, 0, 0, 1, 0, 0);
    sc.fillStyle = `rgb(${skyColor(90, 0, sunHz, air).map(Math.round).join(',')})`;
    sc.fillRect(0, 0, bw, bh);
    sc.lineJoin = 'round';
    sc.lineWidth = 1.1;
    const ALT = [0, 1, 2.2, 3.6, 5.4, 7.6, 10.4, 14, 18.5, 24, 31, 40, 52, 68, 90];
    // azimuth only matters when there is a Sun to make it matter
    const AZN = air.day > 0.01 || air.twilight > 0.01 ? 72 : 16;
    const pt = (a, z) => {
      const p = P.far(Sky.altAzToVec(a, z));
      return [p.x / K, p.y / K];
    };
    for (let j = 0; j < ALT.length - 1; j++) {
      const a0 = ALT[j],
        a1 = ALT[j + 1],
        am = (a0 + a1) / 2;
      let row0 = null;
      for (let i = 0; i <= AZN; i++) {
        const z = i * 360 / AZN;
        const c0 = pt(a0, z),
          c1 = pt(a1, z);
        if (row0) {
          const minx = Math.min(row0[0][0], row0[1][0], c0[0], c1[0]);
          const maxx = Math.max(row0[0][0], row0[1][0], c0[0], c1[0]);
          const miny = Math.min(row0[0][1], row0[1][1], c0[1], c1[1]);
          const maxy = Math.max(row0[0][1], row0[1][1], c0[1], c1[1]);
          if (maxx > -2 && minx < bw + 2 && maxy > -2 && miny < bh + 2 && maxx - minx < bw * 3) {
            const col = skyColor(am, z - 180 / AZN, sunHz, air);
            const css = `rgb(${Math.round(col[0])},${Math.round(col[1])},${Math.round(col[2])})`;
            sc.fillStyle = css;
            sc.strokeStyle = css; // closes the seam between neighbours
            sc.beginPath();
            sc.moveTo(row0[0][0], row0[0][1]);
            sc.lineTo(c0[0], c0[1]);
            sc.lineTo(c1[0], c1[1]);
            sc.lineTo(row0[1][0], row0[1][1]);
            sc.closePath();
            sc.fill();
            sc.stroke();
          }
        }
        row0 = [c0, c1];
      }
    }
    // one soft pass at buffer size erases the facets of the mesh
    if (!SKY_SOFT) {
      SKY_SOFT = document.createElement('canvas');
      SKY_SOFT_CTX = SKY_SOFT.getContext('2d');
    }
    if (SKY_SOFT.width !== bw || SKY_SOFT.height !== bh) {
      SKY_SOFT.width = bw;
      SKY_SOFT.height = bh;
    }
    const so = SKY_SOFT_CTX;
    so.setTransform(1, 0, 0, 1, 0, 0);
    so.filter = 'blur(1.7px)';
    so.clearRect(0, 0, bw, bh);
    so.drawImage(SKY_BUF, 0, 0);
    so.filter = 'none';
    ctx.drawImage(SKY_SOFT, 1, 1, bw - 2, bh - 2, 0, 0, w, h);
  }

  /* Milky Way · composited at a quarter of the resolution: the band is soft by
     nature, and this keeps 900 large alpha blits off the main surface */
  if (layers.milkyway && vis > 0.02) {
    const bw = Math.max(1, Math.ceil(w / 4)),
      bh = Math.max(1, Math.ceil(h / 4));
    if (!HAZE_BUF) {
      HAZE_BUF = document.createElement('canvas');
      HAZE_CTX = HAZE_BUF.getContext('2d');
    }
    if (HAZE_BUF.width !== bw || HAZE_BUF.height !== bh) {
      HAZE_BUF.width = bw;
      HAZE_BUF.height = bh;
    }
    const bc = HAZE_CTX;
    bc.setTransform(1, 0, 0, 1, 0, 0);
    bc.clearRect(0, 0, bw, bh);
    const gain = (detail ? 1 : 0.55) * vis;
    for (const b of FIELD.haze) {
      const p = P.eq(b.v);
      if (!p) continue;
      const rr = P.degToPx(b.r) / 4;
      if (rr < 0.7) continue;
      const x = p.x / 4,
        y = p.y / 4;
      if (x < -rr || x > bw + rr || y < -rr || y > bh + rr) continue;
      bc.globalAlpha = b.a * gain;
      bc.drawImage(HAZE, x - rr, y - rr, rr * 2, rr * 2);
    }
    bc.globalAlpha = 1;
    ctx.drawImage(HAZE_BUF, 0, 0, bw, bh, 0, 0, w, h);
  }

  /* faint field */
  if (vis > 0.02) for (const s of FIELD.faint) {
    const p = P.eq(s.v);
    if (!p || p.x < -20 || p.x > w + 20 || p.y < -20 || p.y > h + 20) continue;
    const r = starRadius(s.mag, view.fov);
    ctx.fillStyle = rgba(s.color, Sky.clamp(1.06 - (s.mag - 4.6) * 0.26, 0.14, 0.88) * vis);
    if (r <= 0.8) ctx.fillRect(p.x - r, p.y - r, r * 2, r * 2);else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, TAU);
      ctx.fill();
    }
  }

  /* constellation figures */
  if (layers.constellations && vis > 0.04) {
    ctx.lineWidth = 1;
    ctx.strokeStyle = `rgba(130,172,226,${(0.40 * vis).toFixed(3)})`;
    ctx.beginPath();
    for (const f of Sky.FIGURES) {
      for (const path of f.paths) {
        let prev = null;
        for (const id of path) {
          const s = Sky.STAR_BY_ID[id];
          if (prev && s) traceArc(ctx, P, prev.v, s.v);
          prev = s;
        }
      }
    }
    ctx.stroke();
  }

  /* user constellations, and the one being drawn right now */
  const fx = o.fx || {};
  const nowMs = performance.now();
  const drawFigure = (fig, style) => {
    const vecs = fig.stars.map(st => st.v || Sky.eqVec(st.ra, st.dec));
    const pts = vecs.map(v => P.eq(v));
    const live = !!style.animate && fx.live !== false;
    ctx.save();
    ctx.lineWidth = style.width;
    ctx.strokeStyle = style.stroke;
    ctx.shadowColor = style.glow;
    ctx.shadowBlur = style.blur;
    ctx.setLineDash(style.dash || []);
    if (live) ctx.lineDashOffset = -nowMs / 55; // the ants keep marching
    ctx.beginPath();
    (fig.links || []).forEach(([a, b]) => {
      const va = vecs[a],
        vb = vecs[b];
      if (!va || !vb) return;
      let k = 1;
      if (live && fx.linkAt) {
        const born = fx.linkAt[a < b ? a + '-' + b : b + '-' + a];
        if (born) k = Sky.clamp((nowMs - born) / 420, 0, 1);
        k = 1 - Math.pow(1 - k, 3); // the line runs out to meet the star
      }
      traceArc(ctx, P, va, vb, k);
    });
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
    ctx.shadowBlur = 0;

    // the rubber band that follows the cursor while a line is open
    if (live && fx.pointer && fx.lastIdx !== null && fx.lastIdx !== undefined && pts[fx.lastIdx]) {
      const pa = pts[fx.lastIdx];
      ctx.save();
      ctx.setLineDash([2, 6]);
      ctx.lineDashOffset = -nowMs / 40;
      ctx.strokeStyle = 'rgba(234,217,189,0.50)';
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(fx.pointer.x, fx.pointer.y);
      ctx.stroke();
      ctx.restore();
    }
    pts.forEach((p, i) => {
      if (!p) return;
      const isHead = live && fx.lastIdx === i;
      ctx.strokeStyle = style.node;
      ctx.lineWidth = isHead ? 1.8 : 1.2;
      const breathe = isHead ? 1 + 0.12 * Math.sin(nowMs / 320) : 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, style.nodeR * breathe, 0, TAU);
      ctx.stroke();
      if (isHead) {
        ctx.strokeStyle = 'rgba(236,220,193,0.32)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, style.nodeR * breathe + 4, 0, TAU);
        ctx.stroke();
      }
      if (fig.stars[i].note) {
        ctx.fillStyle = style.noteFill;
        ctx.beginPath();
        ctx.arc(p.x + style.nodeR + 3.5, p.y - style.nodeR - 3, 2.2, 0, TAU);
        ctx.fill();
      }
    });
    ctx.restore();
    if (fig.name && detail) {
      const shown = pts.filter(Boolean);
      if (shown.length) {
        const mx = shown.reduce((a, p) => a + p.x, 0) / shown.length;
        const my = shown.reduce((a, p) => a + p.y, 0) / shown.length;
        ctx.font = '500 11px "IBM Plex Mono", monospace';
        ctx.fillStyle = style.label;
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,.9)';
        ctx.shadowBlur = 5;
        ctx.fillText(fig.name.toUpperCase(), mx, my - 14);
        ctx.shadowBlur = 0;
        ctx.textAlign = 'left';
      }
    }
  };

  /* a ring leaves every star as it is taken into a constellation */
  const drawPulses = () => {
    if (!fx.pulses || !fx.pulses.length) return;
    ctx.save();
    for (const pu of fx.pulses) {
      const k = (nowMs - pu.t0) / 900;
      if (k < 0 || k > 1) continue;
      const p = P.eq(pu.v);
      if (!p) continue;
      const e = 1 - Math.pow(1 - k, 2.6);
      ctx.strokeStyle = `rgba(${pu.tint || '233,216,189'},${(1 - k) * 0.85})`;
      ctx.lineWidth = 1.6 * (1 - k) + 0.4;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4 + e * 30, 0, TAU);
      ctx.stroke();
      if (k < 0.45) {
        ctx.strokeStyle = `rgba(255,236,220,${(0.45 - k) * 1.4})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 + e * 12, 0, TAU);
        ctx.stroke();
      }
    }
    ctx.restore();
  };

  /* Your own constellations sit lightly on the sky. They are yours, so they do
     not have to shout; the one you are looking at is the same blue, only surer. */
  const savedStyle = {
    width: 1.05,
    stroke: 'rgba(158,197,239,0.34)',
    glow: 'rgba(118,168,234,0.30)',
    blur: 4,
    node: 'rgba(176,208,242,0.32)',
    nodeR: 4.2,
    noteFill: 'rgba(206,228,252,0.58)',
    label: 'rgba(184,212,244,0.50)'
  };
  const focusStyle = {
    width: 1.5,
    stroke: 'rgba(188,221,255,0.80)',
    glow: 'rgba(130,186,250,0.70)',
    blur: 9,
    node: 'rgba(214,234,255,0.80)',
    nodeR: 5,
    noteFill: 'rgba(228,241,255,0.95)',
    label: 'rgba(212,234,255,0.90)'
  };
  /* The draft is warm rather than orange, so it reads as a different temperature
     of the same light instead of a second colour fighting the first. */
  const draftStyle = {
    width: 1.4,
    stroke: 'rgba(233,216,189,0.78)',
    glow: 'rgba(206,178,138,0.42)',
    blur: 6,
    dash: [5, 4],
    node: 'rgba(238,223,197,0.85)',
    nodeR: 5,
    noteFill: 'rgba(246,233,207,1)',
    label: 'rgba(234,217,189,0.80)',
    animate: true
  };
  if (layers.mine) (o.userFigures || []).forEach(f => drawFigure(f, o.focusId && f.id === o.focusId ? focusStyle : savedStyle));
  if (o.draft && o.draft.stars.length) drawFigure(Object.assign({}, o.draft, {
    name: null
  }), draftStyle);

  /* catalogue stars */
  const nameLimit = view.fov > 120 ? 1.9 : view.fov > 60 ? 2.6 : view.fov > 25 ? 3.4 : 4.6;
  for (const s of Sky.STARS) {
    const p = P.eq(s.v);
    if (!p || p.x < -30 || p.x > w + 30 || p.y < -30 || p.y > h + 30) continue;
    const r = starRadius(s.mag, view.fov);
    if (s.mag < 2.6) {
      const gl = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 5.5);
      gl.addColorStop(0, rgba(s.color, 0.42 * Math.pow(vis, 0.55)));
      gl.addColorStop(1, rgba(s.color, 0));
      ctx.fillStyle = gl;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 5.5, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = rgba(s.color, 0.98 * Math.pow(vis, 0.55));
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, TAU);
    ctx.fill();
    hits.push({
      x: p.x,
      y: p.y,
      r: Math.max(9, r + 6),
      obj: s
    });
    if (layers.starNames && detail && vis > 0.3 && s.mag <= nameLimit) label(s.name, p.x, p.y, {
      color: 'rgba(176,203,236,0.82)',
      dx: r + 6
    });
  }

  /* deep sky */
  if (layers.dso && vis > 0.05) {
    for (const d of Sky.DSO) {
      const p = P.eq(d.v);
      if (!p || p.x < -40 || p.x > w + 40 || p.y < -40 || p.y > h + 40) continue;
      const rr = Sky.clamp(P.degToPx(d.size / 60 / 2), 3.5, 90);
      ctx.save();
      ctx.lineWidth = 1;
      if (d.dsoType === 'galaxy') {
        ctx.strokeStyle = 'rgba(196,178,225,0.55)';
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, rr, rr * 0.48, -0.5, 0, TAU);
        ctx.stroke();
      } else if (d.dsoType === 'nebula') {
        ctx.strokeStyle = 'rgba(140,205,190,0.5)';
        ctx.setLineDash([3, 3]);
        ctx.strokeRect(p.x - rr, p.y - rr * 0.8, rr * 2, rr * 1.6);
        ctx.setLineDash([]);
      } else {
        ctx.strokeStyle = 'rgba(190,214,150,0.5)';
        ctx.setLineDash([2.5, 3.5]);
        ctx.beginPath();
        ctx.arc(p.x, p.y, rr, 0, TAU);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.restore();
      hits.push({
        x: p.x,
        y: p.y,
        r: Math.max(11, rr),
        obj: d
      });
      if (detail && view.fov < 130) label(d.catalog, p.x, p.y, {
        color: 'rgba(160,186,206,0.66)',
        dx: rr + 5,
        font: '400 10px "IBM Plex Mono", monospace'
      });
    }
  }

  /* constellation names */
  if (layers.constellations && layers.figureNames && detail && vis > 0.25) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '500 10px "IBM Plex Mono", monospace';
    for (const f of Sky.FIGURES) {
      const p = P.eq(f.v);
      if (!p || p.x < 0 || p.x > w || p.y < 0 || p.y > h) continue;
      ctx.fillStyle = 'rgba(134,166,208,0.42)';
      ctx.shadowColor = 'rgba(0,0,0,.85)';
      ctx.shadowBlur = 5;
      ctx.fillText(f.name.toUpperCase(), p.x, p.y);
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  /* solar system */
  if (layers.planets && o.bodies) {
    for (const b of o.bodies) {
      const p = P.eq(b.v || (b.v = Sky.eqVec(b.ra, b.dec)));
      if (!p || p.x < -60 || p.x > w + 60 || p.y < -60 || p.y > h + 60) continue;
      const isSun = b.id === 'sun',
        isMoon = b.id === 'moon';
      let r = isSun || isMoon ? Math.max(3.5, P.degToPx(b.angSize) / 2) : starRadius(b.mag, view.fov);
      if (!isSun && !isMoon) r = Math.max(r, P.degToPx(b.angSize) / 2);
      const glowR = isSun ? r * 9 : r * 5.5;
      const gl = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
      gl.addColorStop(0, rgba(b.color, isSun ? 0.75 : 0.34));
      gl.addColorStop(1, rgba(b.color, 0));
      ctx.fillStyle = gl;
      ctx.beginPath();
      ctx.arc(p.x, p.y, glowR, 0, TAU);
      ctx.fill();
      if (isMoon && r > 4) {
        const dark = 'rgba(26,32,46,0.98)',
          lit = rgba(b.color, 1),
          k = 2 * b.illum - 1;
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, TAU);
        ctx.clip();
        ctx.fillStyle = dark;
        ctx.fillRect(p.x - r - 1, p.y - r - 1, 2 * r + 2, 2 * r + 2);
        ctx.fillStyle = lit;
        if (b.waxing) ctx.fillRect(p.x, p.y - r - 1, r + 1, 2 * r + 2);else ctx.fillRect(p.x - r - 1, p.y - r - 1, r + 1, 2 * r + 2);
        ctx.fillStyle = b.illum > 0.5 ? lit : dark;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, Math.abs(k) * r, r, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
      } else {
        ctx.fillStyle = rgba(b.color, 1);
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, TAU);
        ctx.fill();
      }
      if (b.id === 'saturn' && r > 4) {
        ctx.strokeStyle = rgba(b.color, 0.8);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, r * 2.3, r * 0.6, -0.35, 0, TAU);
        ctx.stroke();
      }
      hits.push({
        x: p.x,
        y: p.y,
        r: Math.max(12, r + 7),
        obj: b
      });
      if (detail) label(b.name, p.x, p.y, {
        color: 'rgba(244,248,255,0.95)',
        dx: r + 6,
        font: '500 11.5px "IBM Plex Sans", sans-serif'
      });
    }
  }

  /* ground, horizon, cardinals — the ground stands on its own */
  if (layers.horizon || layers.ground) {
    // The horizon is a great circle; under this projection its screen radius at
    // bearing b solves sin(alt)=0, giving theta = atan(-tan(altC)/sin b).
    const altC = Sky.clamp(view.alt, -88, 88);
    const aC = (Math.abs(altC) < 0.08 ? altC >= 0 ? 0.08 : -0.08 : altC) * Sky.D2R;
    const ta = Math.tan(aC);
    const RMAX = 2.4 * Math.hypot(w, h);
    const N = 240,
      pts = [];
    for (let i = 0; i <= N; i++) {
      const bng = i / N * TAU;
      let t = Math.atan2(-ta, Math.sin(bng));
      if (t < 0) t += Math.PI;
      const r = Math.min(t * P.scale, RMAX);
      pts.push([P.cx + r * Math.cos(bng), P.cy - r * Math.sin(bng)]);
    }
    const trace = pl => {
      const a = pl || pts;
      ctx.moveTo(a[0][0], a[0][1]);
      for (let i = 1; i < a.length; i++) ctx.lineTo(a[i][0], a[i][1]);
      ctx.closePath();
    };
    if (layers.ground) {
      ctx.save();
      ctx.beginPath();
      trace();
      if (altC >= 0) {
        ctx.rect(-2, -2, w + 4, h + 4);
        ctx.clip('evenodd');
      } else ctx.clip();
      const nad = P.far(Sky.altAzToVec(-89.99, view.az));
      const lit = c => `rgb(${mix3(c, [74, 80, 64], air.day * 0.82).map(Math.round).join(',')})`;
      const rg = ctx.createRadialGradient(nad.x, nad.y, 0, nad.x, nad.y, Math.max(60, P.degToPx(90)));
      rg.addColorStop(0, lit([2, 3, 6]));
      rg.addColorStop(0.7, lit([5, 9, 18]));
      rg.addColorStop(1, lit([11, 19, 34]));
      ctx.fillStyle = rg;
      ctx.fillRect(-2, -2, w + 4, h + 4);
      ctx.restore();
    }
    if (layers.horizon) {
      ctx.beginPath();
      trace();
      ctx.strokeStyle = 'rgba(88,124,184,0.16)';
      ctx.lineWidth = 7;
      ctx.stroke();
      ctx.beginPath();
      trace();
      ctx.strokeStyle = 'rgba(104,142,200,0.22)';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.beginPath();
      trace();
      ctx.strokeStyle = 'rgba(150,180,224,0.42)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    if (layers.horizon && layers.cardinals) {
      ctx.save();
      ctx.textAlign = 'center';
      const marks = [['N', 0, 1], ['NE', 45, 0], ['E', 90, 1], ['SE', 135, 0], ['S', 180, 1], ['SW', 225, 0], ['W', 270, 1], ['NW', 315, 0]];

  };
